[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/tty.usbmodem5AE60209531
monitor_port = /dev/tty.usbmodem5AE60209531
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
board_build.partitions = partitions.csv
extra_scripts =
    pre:scripts/gen_secrets.py
    pre:scripts/gen_extra_cards.py
