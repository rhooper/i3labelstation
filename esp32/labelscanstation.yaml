---
esphome:
  name: labelscanstation
  friendly_name: Label Scan Station
  platformio_options:
    build_flags:
      - -UUSE_LOGGER_USB_SERIAL_JTAG

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # Disable USB-Serial-JTAG so USB OTG host mode can use the shared PHY
      CONFIG_USJ_ENABLE_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG_ENABLED: "n"

external_components:
  - source:
      type: local
      path: components

logger:
  hardware_uart: UART0
  level: VERBOSE

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: sntp_time

usb_host:
  enable_hubs: true
  devices:
    - vid: 0x0000
      pid: 0x0000

usb_printer:
  - type: BROTHER_QL
    id: label_printer
    model: QL-500
    vid: 0x04F9
    pid: 0x2015
    label: 29x90
    lambda: |-
      // Label is 306 x 991 pixels (29mm x 90mm at 300dpi)
      // Draw i3 logo on the left
      it.image(20, 53, id(i3logo));

      // Title text to the right of logo
      it.print(220, 80, id(title_font), "i3 Detroit");

      // Date below title
      auto time = id(sntp_time).now();
      if (time.is_valid()) {
        it.strftime(220, 180, id(date_font), "%Y-%m-%d", time);
      } else {
        it.print(220, 180, id(date_font), "(no time)");
      }

font:
  - id: title_font
    file: "gfonts://Roboto@700"
    size: 60
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz'
  - id: date_font
    file: "gfonts://Roboto"
    size: 36
    glyphs: '0123456789-/:() abcdefghijklmnopqrstuvwxyz'

image:
  - id: i3logo
    file: i3logo.png
    resize: 180x180
    type: BINARY

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Print Button"
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - logger.log: "Print button pressed!"
        - usb_printer.print:
            id: label_printer
